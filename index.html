<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
  />

  <title>时代骏风</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/header.css" />

</head>

<body>

  <!-- ========================================
       Header
  ========================================= -->

  <header class="main-header">

    <div class="header-container">

      <!-- Logo -->
      <a
        href="index.html"
        class="logo-link"
      >

        <img
          src="images/logo.png"
          alt="公司Logo"
          class="logo"
        />

      </a>

      <!-- Nav -->
      <nav class="main-nav">

        <a
          href="index.html"
          class="nav-link active"
        >
          Home
        </a>

        <a
          href="news.html"
          class="nav-link"
        >
          大事件
        </a>

        <a
          href="forum.html"
          class="nav-link"
        >
          铁汁窝
        </a>

      </nav>

      <!-- User -->
      <div class="header-user">

        <a
          href="profile.html"
          class="user-link"
        >

          <img
            src="images/people.jpg"
            alt="个人中心"
            class="user-avatar"
          />

        </a>

      </div>

    </div>

  </header>

  <!-- ========================================
       Main
  ========================================= -->

  <section id="home">

    <!-- iX*OnE -->

    <a
      href="members.html"
      class="department-card"
    >

      <img
        src="images/iX*OnE.jpg"
        alt="iX*OnE"
      />

      <p class="hover-text">
        iX*OnE
      </p>

      <p class="mobile-text">
        iX*OnE
      </p>

    </a>

    <!-- plan -->

    <div class="plan-wrapper">

      <a
        href="vote.html"
        class="plan-link"
      >

        <img
          src="images/plan.jpg"
          alt="登顶计划"
          class="plan-img"
        />

      </a>

      <div class="plan-text">

        <div class="plan-title">
          《登顶计划》助登通道 👈
        </div>

        <div class="plan-desc">
          点击图片，立刻给你喜欢的练习生助登吧！
        </div>

      </div>

    </div>

  </section>

  <!-- ========================================
       Footer
  ========================================= -->

  <footer>

    <p>
      © 2026 时代骏风
    </p>

  </footer>

  <!-- ========================================
       Script
  ========================================= -->

  <script>

    // ========================================
    // 登录检查
    // ========================================

    const currentUser =
      JSON.parse(
        localStorage.getItem(
          'currentUser'
        )
      );

    if (!currentUser) {

      window.location.href =
        'login.html';
    }

    // ========================================
    // Avatar
    // ========================================

    const avatarImg =
      document.querySelector(
        '.user-avatar'
      );

    if (
      avatarImg &&
      currentUser
    ) {

      avatarImg.src =
        currentUser.avatar ||
        'images/people.jpg';

      avatarImg.onerror = () => {

        avatarImg.src =
          'images/people.jpg';
      };
    }

    // ========================================
    // Header scroll hide
    // ========================================

    let lastScrollTop = 0;

    const header =
      document.querySelector(
        '.main-header'
      );

    window.addEventListener(
      'scroll',
      () => {

        const scrollTop =
          window.pageYOffset ||
          document.documentElement.scrollTop;

        if (
          scrollTop > lastScrollTop &&
          scrollTop > 50
        ) {

          header.classList.add(
            'hide'
          );

        } else {

          header.classList.remove(
            'hide'
          );
        }

        lastScrollTop =
          scrollTop;
      }
    );

  </script>

</body>

</html>
