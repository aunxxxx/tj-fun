<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时代骏风</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
<div class="header-container">
   <a href="about.html">
    <img src="images/logo.png" alt="公司Logo" class="logo">
</a>
    <nav>
        <a href="index.html" class="current">Home</a>
        <a href="news.html">大事件</a>
        <a href="forum.html">铁汁窝</a>
    </nav>
    <!-- 新增：个人中心图标 -->
    <div class="user-area">
        <a href="profile.html" class="user-icon">
            <img src="images/people.jpg" alt="个人中心" class="user-avatar">
        </a>
    </div>
</div>
</header>

<section id="home">
    <!-- iX*OnE 图片卡片 -->
    <a href="members.html" class="department-card">
        <img src="images/iX*OnE.jpg" alt="iX*OnE">
        <p class="hover-text">iX*OnE</p>     <!-- 电脑端：鼠标悬浮才显示 -->
        <p class="mobile-text">iX*OnE</p>    <!-- 手机端：始终显示在图片下方 -->
    </a>
   
    <!-- plan 区域（左图右文）-->
    <div class="plan-wrapper">
        <a href="vote.html" class="plan-link">
            <img src="images/plan.jpg" alt="登顶计划" class="plan-img">
        </a>
        <div class="plan-text">
            <div class="plan-title">《登顶计划》助登通道 👈</div>
            <div class="plan-desc">点击图片，立刻给你喜欢的练习生助登吧！</div>
        </div>
    </div>
</section>

<footer>
    <p>© 2026 时代骏风</p>
</footer>

<script>
   // ========== 强制登录检查（放在最前面）==========
const currentUser = JSON.parse(localStorage.getItem('currentUser'));
if (!currentUser) {
    window.location.href = 'login.html';
}

// 设置右上角头像
const avatarImg = document.querySelector('.user-avatar');
if (avatarImg && currentUser) {
    avatarImg.src = currentUser.avatar || 'images/people.jpg';
    avatarImg.onerror = () => { avatarImg.src = 'images/people.jpg'; };
}

   // ========== 原来的滚动隐藏代码 ==========
let lastScrollTop = 0;
const header = document.querySelector('header');
window.addEventListener('scroll', function() {
    let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    if (scrollTop > lastScrollTop && scrollTop > 50) {
        header.classList.add('hide');
    } else {
        header.classList.remove('hide');
    }
    lastScrollTop = scrollTop;
});
</script>

</body>
</html>
