<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>铁汁窝 2.54</title>

  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modal.css">

  <style>
    .forum-container {
      display: flex;
      gap: 20px;
      padding: 20px;
    }

    .post-section {
      flex: 1;
      min-height: 600px;
    }

    .side-panel {
      width: 280px;
    }

    .modal.hidden {
      display: none;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      width: 500px;
      max-height: 80vh;
      background: #fff;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #eee;
    }

    #commentList {
      flex: 1;
      overflow: auto;
      padding: 10px;
    }

    .comment-input-bar {
      display: flex;
      padding: 10px;
      border-top: 1px solid #eee;
      gap: 10px;
    }

    .comment-input-bar input {
      flex: 1;
      padding: 6px;
    }
  </style>
</head>

<body>

<div class="page-wrapper" id="pageWrapper">

  <!-- ================= HEADER ================= -->
  <header class="main-header">

    <div class="header-container">

      <a href="index.html" class="logo-link">
        <img src="images/logo.png" class="logo" />
      </a>

      <nav class="main-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="news.html" class="nav-link">大事件</a>
        <a href="forum.html" class="nav-link active">铁汁窝</a>
      </nav>

      <div class="header-user">
        <a href="profile.html">
          <img src="images/people.jpg" class="user-avatar" />
        </a>
      </div>

    </div>

  </header>

  <!-- ================= MAIN ================= -->
  <main class="forum-container">

    <!-- 帖子流 -->
    <section class="post-section" id="postList">
      <!-- postCard.js 渲染这里 -->
    </section>

    <!-- 侧边栏 -->
    <aside class="side-panel">

      <div id="hotKeywords"></div>
      <div id="recommendPanel"></div>

    </aside>

  </main>

  <!-- ================= COMMENT MODAL ================= -->
  <div id="commentModal" class="modal hidden">

    <div class="modal-content">

      <div class="modal-header">
        <span>评论</span>
        <button id="closeCommentModal">×</button>
      </div>

      <!-- 评论列表 -->
      <div id="commentList"></div>

      <!-- 输入框 -->
      <div class="comment-input-bar">
        <input id="commentInput" placeholder="写评论..." />
        <button id="sendCommentBtn">发送</button>
      </div>

    </div>

  </div>

</div>

<!-- ================= JS ================= -->

<script src="js/config.js"></script>
<script src="js/utils.js"></script>

<script src="js/services/storage.js"></script>
<script src="js/services/like.js"></script>
<script src="js/services/post.js"></script>

<script src="js/components/postCard.js"></script>
<script src="js/components/commentModal.js"></script>
<script src="js/components/hotKeywords.js"></script>
<script src="js/components/postEditor.js"></script>

<script src="js/hooks/reply.js"></script>
<script src="js/hooks/modal.js"></script>
<script src="js/hooks/animation.js"></script>

<script src="js/main.js"></script>

</body>
</html>
