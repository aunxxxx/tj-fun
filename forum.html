  <style>
    body {
      font-family: Arial;

    .forum-container {
      display: flex;
      gap: 20px;
      padding: 20px;
    }

    .post-section {
      flex: 1;
      min-height: 600px;
      background: #f5f5f5;
    }

    .side-panel {
      width: 280px;
      background: #eee;
    }

    .modal.hidden {
      display: none;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      width: 500px;
      max-height: 80vh;
      background: #fff;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #eee;
    }

    #commentList {
      flex: 1;
      overflow: auto;
      padding: 10px;
    }

    .comment-input-bar {
      display: flex;
      padding: 10px;
      border-top: 1px solid #eee;
      gap: 10px;
    }

    .comment-input-bar input {
      flex: 1;
      padding: 6px;
    }
