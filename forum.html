<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>铁汁窝 - 时代骏风</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ========== 铁汁窝专用样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fb;
        }

        .forum-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 100px 16px 60px;
        }

        /* 烧榜模块 */
        .hot-section {
            background: #fff6ea;
            border-radius: 28px;
            padding: 16px;
            margin-bottom: 28px;
            position: relative;
        }

        .plus-btn {
            position: absolute;
            top: 12px;
            left: 16px;
            width: 32px;
            height: 32px;
            background: #ff7b5c;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
        }

        .hot-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 16px;
            color: #ff7b5c;
        }

        .hot-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hot-item {
            background: white;
            border-radius: 20px;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .hot-item:active {
            background: #f0e4d0;
        }

        .hot-name {
            font-weight: 700;
        }

        .hot-count {
            font-size: 13px;
            color: #b97f4a;
        }

        /* 帖子列表 */
        .posts-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .post-card {
            background: white;
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .post-header {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .post-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            object-fit: cover;
        }

        .author-name {
            font-weight: bold;
            cursor: pointer;
        }

        .verified-badge {
            background-color: #1e90ff;
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            margin-left: 8px;
            display: inline-block;
        }

        .post-time {
            font-size: 11px;
            color: #aaa;
            margin-top: 4px;
        }

        .post-content {
            margin: 12px 0;
        }

        .post-image {
            max-width: 100%;
            border-radius: 20px;
            margin-top: 8px;
        }

        .post-stats {
            display: flex;
            gap: 24px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        .stat-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #777;
        }

        .stat-num {
            cursor: pointer;
        }

        /* ===== 弹窗遮罩（全屏模糊） ===== */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 3000;
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }

        .modal-mask.show {
            visibility: visible;
            opacity: 1;
        }

        /* 电脑端弹窗卡片（居中） */
        .modal-card {
            background: #1e1e2a;
            color: white;
            border-radius: 32px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            max-height: 70vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .modal-card .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .modal-card .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        /* 手机端底部抽屉 */
       .drawer-modal {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #1e1e2a;
    color: white;
    border-radius: 32px 32px 0 0;    /* 👈 顶部圆角 32px */
    z-index: 3100;
    transition: transform 0.3s ease, height 0.2s ease;  /* 👈 加上 height 过渡 */
    transform: translateY(100%);
    height: 80vh;    /* 👈 高度 80% */
    display: flex;
    flex-direction: column;
}

.drawer-modal.open {
    transform: translateY(0);
}

.drag-bar {
    width: 50px;
    height: 5px;
    background: #aaa;
    border-radius: 10px;
    margin: 14px auto;
    cursor: pointer;
}

.drawer-content {
    flex: 1;
    overflow-y: auto;
    padding: 0 20px 30px;
}

        .modal-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .modal-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .modal-username {
            font-weight: 500;
        }

        .modal-comment-text {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 4px;
        }

        /* 发帖全屏层 */
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 4000;
            transform: scale(0);
            transition: transform 0.3s ease;
            overflow: auto;
        }

        .fullscreen-overlay.open {
            transform: scale(1);
        }

        .post-editor {
            padding: 60px 24px;
            max-width: 600px;
            margin: 0 auto;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .editor-close, .editor-submit {
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
        }

        .editor-textarea {
            width: 100%;
            font-size: 18px;
            border: none;
            outline: none;
            resize: none;
        }

        .image-picker {
            width: 100%;
            aspect-ratio: 1;
            background: #f5f5f5;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <a href="about.html">
            <img src="images/logo.png" alt="公司Logo" class="logo">
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="news.html">大事件</a>
            <a href="forum.html" class="current">铁汁窝</a>
        </nav>
        <div class="user-area">
            <a href="profile.html">
                <img src="images/people.jpg" alt="个人中心" class="user-avatar">
            </a>
        </div>
    </div>
</header>

<div class="forum-container" id="forumApp"></div>

<script>
    // ========== 配置 ==========
    const VERIFIED_BADGE_TEXT = "✓ 官方认证";
    const HOT_POST_COUNT = 3;
    const MANUAL_TOP_WORDS = ["登顶计划"];

    let currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser) location.href = 'login.html';
    const isTrainee = currentUser.role === 'trainee';

    let posts = JSON.parse(localStorage.getItem('forum_posts')) || [];
    if (posts.length === 0) {
        posts = [
            { id: 1, author: "李四", content: "第一位认证用户报到！大家好啊！", image: null, time: new Date(2026, 4, 20, 8, 56, 54).toLocaleString(), likes: 10, likedBy: ["张三"], comments: [] },
            { id: 2, author: "张三", content: "契弟广场终于开了，开心！", image: null, time: new Date(2026, 4, 21, 6, 56, 54).toLocaleString(), likes: 3, likedBy: ["李四"], comments: [] }
        ];
        savePosts();
    }

    function savePosts() { localStorage.setItem('forum_posts', JSON.stringify(posts)); }

    // 词条提取
    function extractWords(content) {
        const words = content.match(/[\u4e00-\u9fa5]{2,6}/g) || [];
        return [...new Set(words)];
    }

    function getHotWords() {
        const wordStats = new Map();
        posts.forEach(post => {
            const words = extractWords(post.content);
            words.forEach(word => {
                if (!wordStats.has(word)) wordStats.set(word, { count: 0, likes: 0, comments: 0 });
                const stat = wordStats.get(word);
                stat.count++; stat.likes += post.likes || 0; stat.comments += (post.comments?.length || 0);
            });
        });
        let list = Array.from(wordStats.entries()).map(([w, s]) => ({ word: w, heat: s.count + s.likes + s.comments }));
        list.sort((a,b) => b.heat - a.heat);
        const manual = MANUAL_TOP_WORDS.filter(w => list.some(i => i.word === w));
        const auto = list.filter(i => !MANUAL_TOP_WORDS.includes(i.word));
        return [...manual.map(w => ({ word: w, heat: list.find(i => i.word === w)?.heat || 0 })), ...auto].slice(0, HOT_POST_COUNT);
    }

    function renderHotWords() {
        const hot = getHotWords();
        if (!hot.length) return '<div class="hot-item">暂无热门词条</div>';
        return hot.map(h => `<div class="hot-item" data-word="${h.word}">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <div class="hot-name">${escapeHtml(h.word)}</div>
        <div class="hot-count">🔥 ${h.heat}</div>
    </div>
</div>`).join('');
    }

    function renderPosts() {
        if (!posts.length) return '<div style="text-align:center;padding:40px;">暂无帖子</div>';
        return posts.map(post => {
            const user = JSON.parse(localStorage.getItem('users'))?.find(u => u.username === post.author) || {};
            const showVerified = user.role === 'trainee' && user.isVerified;
            return `
                <div class="post-card">
                    <div class="post-header">
                        <img class="post-avatar" src="${user.avatar || 'images/people.jpg'}" onclick="viewProfile('${post.author}')">
                        <div>
                            <span class="author-name" onclick="viewProfile('${post.author}')">${escapeHtml(post.author)}</span>
                            ${showVerified ? `<span class="verified-badge">${VERIFIED_BADGE_TEXT}</span>` : ''}
                            <div class="post-time">${post.time}</div>
                        </div>
                    </div>
                    <div class="post-content">${escapeHtml(post.content)}</div>
                    ${post.image ? `<img src="${post.image}" class="post-image">` : ''}
                    <div class="post-stats">
                        <button class="stat-btn">❤️ <span class="stat-num" data-type="likes" data-id="${post.id}">${post.likes || 0}</span></button>
                        <button class="stat-btn">💬 <span class="stat-num" data-type="comments" data-id="${post.id}">${post.comments?.length || 0}</span></button>
                    </div>
                </div>
            `;
        }).join('');
    }

    // 弹窗逻辑（电脑端居中卡片，手机端底部抽屉）
    function showModal(title, list) {
        const isMobile = window.innerWidth <= 768;
        if (!isMobile) {
            // 电脑端居中弹窗
            const mask = document.createElement('div');
            mask.className = 'modal-mask';
            mask.innerHTML = `
                <div class="modal-card">
                    <div class="modal-header">
                        <span>${title}</span>
                        <button class="close-modal">✕</button>
                    </div>
                    <div class="modal-list">
                        ${list.map(item => `
                            <div class="modal-user-item" onclick="viewProfile('${item.username}')">
                                <img class="modal-avatar" src="${item.avatar || 'images/people.jpg'}">
                                <div>${escapeHtml(item.username)}${item.comment ? `<div class="modal-comment-text">${escapeHtml(item.comment)}</div>` : ''}</div>
                            </div>
                        `).join('')}
                        ${!list.length ? '<div>暂无数据</div>' : ''}
                    </div>
                </div>
            `;
            document.body.appendChild(mask);
            setTimeout(() => mask.classList.add('show'), 10);
            mask.querySelector('.close-modal').onclick = () => {
                mask.classList.remove('show');
                setTimeout(() => mask.remove(), 200);
            };
} else {
    // 手机端底部抽屉（向上滑增加高度，向下滑关闭）
    const mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.style.background = 'rgba(0,0,0,0.5)';
    mask.style.backdropFilter = 'blur(8px)';
    mask.style.visibility = 'visible';
    mask.style.opacity = '1';
    document.body.appendChild(mask);

    const drawer = document.createElement('div');
    drawer.className = 'drawer-modal';
    drawer.innerHTML = `
        <div class="drag-bar"></div>
        <div class="drawer-content">
            <div style="font-weight:bold; margin-bottom:20px; font-size:18px;">${title}</div>
            <div class="modal-list">
                ${list.map(item => `
                    <div class="modal-user-item" onclick="viewProfile('${item.username}')">
                        <img class="modal-avatar" src="${item.avatar || 'images/people.jpg'}">
                        <div>${escapeHtml(item.username)}${item.comment ? `<div class="modal-comment-text">${escapeHtml(item.comment)}</div>` : ''}</div>
                    </div>
                `).join('')}
                ${!list.length ? '<div style="text-align:center;padding:40px;">✨ 暂无数据 ✨</div>' : ''}
            </div>
        </div>
    `;
    document.body.appendChild(drawer);
    setTimeout(() => drawer.classList.add('open'), 10);

    let startY = 0;
    let currentHeight = 80;

    const onTouchStart = (e) => {
        startY = e.touches[0].clientY;
    };

    const onTouchMove = (e) => {
        const delta = e.touches[0].clientY - startY;
        if (delta < -30) {
            if (currentHeight < 95) {
                currentHeight = 95;
                drawer.style.height = '95vh';
            }
        } else if (delta > 40) {
            drawer.classList.remove('open');
            mask.style.opacity = '0';
            setTimeout(() => { drawer.remove(); mask.remove(); }, 300);
            window.removeEventListener('touchstart', onTouchStart);
            window.removeEventListener('touchmove', onTouchMove);
        }
    };

    drawer.addEventListener('touchstart', onTouchStart);
    drawer.addEventListener('touchmove', onTouchMove);

    drawer.querySelector('.drag-bar').addEventListener('click', () => {
        drawer.classList.remove('open');
        mask.style.opacity = '0';
        setTimeout(() => { drawer.remove(); mask.remove(); }, 300);
    });

    mask.addEventListener('click', () => {
        drawer.classList.remove('open');
        mask.style.opacity = '0';
        setTimeout(() => { drawer.remove(); mask.remove(); }, 300);
    });
}

            let startY = 0;
            const onTouchStart = (e) => { startY = e.touches[0].clientY; };
            const onTouchMove = (e) => {
                const delta = e.touches[0].clientY - startY;
                if (delta > 50) {
                    drawer.classList.remove('open');
                    setTimeout(() => drawer.remove(), 300);
                    window.removeEventListener('touchstart', onTouchStart);
                    window.removeEventListener('touchmove', onTouchMove);
                }
            };
            drawer.addEventListener('touchstart', onTouchStart);
            drawer.addEventListener('touchmove', onTouchMove);
            drawer.querySelector('.drag-bar').addEventListener('click', () => {
                drawer.classList.remove('open');
                setTimeout(() => drawer.remove(), 300);
            });
        }
    }

    function showLikesModal(postId) {
        const post = posts.find(p => p.id === postId);
        if (!post) return;
        const users = JSON.parse(localStorage.getItem('users')) || [];
        const list = (post.likedBy || []).map(username => {
            const u = users.find(u => u.username === username);
            return { username, avatar: u?.avatar || 'images/people.jpg' };
        });
        showModal(`❤️ 点赞列表 (${list.length})`, list);
    }

    function showCommentsModal(postId) {
        const post = posts.find(p => p.id === postId);
        if (!post) return;
        const users = JSON.parse(localStorage.getItem('users')) || [];
        const list = (post.comments || []).map(c => {
            const u = users.find(u => u.username === c.username);
            return { username: c.username, avatar: u?.avatar || 'images/people.jpg', comment: c.text };
        });
        showModal(`💬 评论列表 (${list.length})`, list);
    }

    function renderForum() {
        document.getElementById('forumApp').innerHTML = `
            <div class="hot-section">
                ${isTrainee ? '<div class="plus-btn" id="plusBtn">+</div>' : ''}
                <div class="hot-title">🔥 烧榜</div>
                <div class="hot-list">${renderHotWords()}</div>
            </div>
            <div class="posts-list">${renderPosts()}</div>
        `;
        document.querySelectorAll('.stat-num[data-type="likes"]').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                showLikesModal(parseInt(el.dataset.id));
            });
        });
        document.querySelectorAll('.stat-num[data-type="comments"]').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                showCommentsModal(parseInt(el.dataset.id));
            });
        });
        if (isTrainee) document.getElementById('plusBtn')?.addEventListener('click', () => alert('发帖功能预留'));
    }

    window.viewProfile = (username) => alert(`跳转到 ${username} 的个人主页（预留）`);
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }

    renderForum();
    let lastScrollTop = 0;
    const header = document.querySelector('header');
    window.addEventListener('scroll', () => {
        let st = window.scrollY;
        if (st > lastScrollTop && st > 50) header.classList.add('hide');
        else header.classList.remove('hide');
        lastScrollTop = st;
    });
</script>
</body>
</html>
