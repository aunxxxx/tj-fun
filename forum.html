<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>铁汁窝 - 时代骏风</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ========== 铁汁窝专用样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fb;
        }

        /* 主容器 - 顶部避开导航栏 */
        .forum-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 100px 16px 60px;   /* 👈 顶部留出导航栏空间，被遮住就改大这个值 */
        }

        /* ===== 烧榜模块 ===== */
        .hot-section {
            background: #fff6ea;
            border-radius: 28px;
            padding: 16px;
            margin-bottom: 28px;
            position: relative;
        }

        /* 加号按钮（仅练习生可见）*/
        .plus-btn {
            position: absolute;
            top: 12px;
            left: 16px;
            width: 32px;
            height: 32px;
            background: #ff7b5c;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: 0.2s;
        }

        .plus-btn:hover {
            transform: scale(1.05);
        }

        .hot-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 16px;
            color: #ff7b5c;
        }

        .hot-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hot-item {
            background: white;
            border-radius: 20px;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.15s;
        }

        /* 点击时整块变浅 */
        .hot-item:active {
            background: #f0e4d0 !important;
        }

        .hot-name {
            font-weight: 700;
            margin-bottom: 6px;
        }

        .hot-count {
            font-size: 13px;
            color: #b97f4a;
        }

        /* ===== 帖子列表 ===== */
        .posts-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .post-card {
            background: white;
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .post-header {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .post-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            object-fit: cover;
        }

        .author-name {
            font-weight: bold;
            cursor: pointer;
        }

        /* 🔽 认证徽章样式（可修改颜色/背景/文字）*/
        .verified-badge {
            background-color: #1e90ff;  /* 👈 改这里调整背景色 */
            color: white;               /* 👈 改这里调整文字颜色 */
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            margin-left: 8px;
            display: inline-block;
        }

        .post-time {
            font-size: 11px;
            color: #aaa;
            margin-top: 4px;
        }

        .post-content {
            margin: 12px 0;
            font-size: 15px;
            line-height: 1.45;
            word-break: break-word;
        }

        .post-image {
            max-width: 100%;
            border-radius: 20px;
            margin-top: 8px;
            max-height: 300px;
        }

        .post-stats {
            display: flex;
            gap: 24px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        .stat-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #777;
        }

        .stat-num {
            cursor: pointer;
        }

        /* ===== 弹窗（点赞/评论列表 - 从底部滑出 + 高斯模糊）===== */
        .slide-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);    /* 🔽 模糊强度，可改 */
            z-index: 3000;                  /* 高于导航栏 */
            display: flex;
            justify-content: center;
            align-items: flex-end;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
        }

        .slide-modal.show {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background: rgba(30, 30, 40, 0.95);
            backdrop-filter: blur(16px);
            width: 100%;
            max-width: 500px;
            border-radius: 32px 32px 0 0;
            padding: 24px 20px 40px;
            color: white;
            max-height: 70vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
        }

        .slide-modal.show .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 18px;
        }

        .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .modal-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .modal-username {
            font-weight: 500;
        }

        .modal-comment-text {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 4px;
        }

        /* ===== 全屏发帖层（动画）===== */
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 4000;
            transform: scale(0);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            overflow-y: auto;
        }

        .fullscreen-overlay.open {
            transform: scale(1);
        }

        .post-editor {
            padding: 60px 24px 40px;
            max-width: 600px;
            margin: 0 auto;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .editor-close, .editor-submit {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            font-weight: 600;
        }

        .editor-submit {
            color: #ff7b5c;
        }

        .editor-textarea {
            width: 100%;
            border: none;
            outline: none;
            font-size: 18px;
            padding: 16px 0;
            resize: none;
            font-family: inherit;
        }

        .image-picker {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #f5f5f5;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-top: 24px;
            background-size: cover;
            background-position: center;
        }

        .image-picker .plus-icon {
            font-size: 48px;
            color: #ccc;
        }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <a href="about.html">
            <img src="images/logo.png" alt="公司Logo" class="logo">
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="news.html">大事件</a>
            <a href="forum.html" class="current">铁汁窝</a>
        </nav>
        <div class="user-area">
            <a href="profile.html">
                <img src="images/people.jpg" alt="个人中心" class="user-avatar">
            </a>
        </div>
    </div>
</header>

<div class="forum-container" id="forumApp"></div>

<script>
    // ========== 可配置项 ==========
    // 🔽 官方认证显示文字（可修改）
    const VERIFIED_BADGE_TEXT = "✓ 官方认证";
    // 🔽 烧榜展示数量
    const HOT_POST_COUNT = 3;
    // 🔽 手动置顶词条（管理员可改，背景色和普通一样）
    const MANUAL_TOP_WORDS = ["登顶计划"];

    // ========== 当前用户 ==========
    let currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser) {
        window.location.href = 'login.html';
    }
    const isTrainee = currentUser.role === 'trainee';

    // ========== 帖子数据 ==========
    let posts = JSON.parse(localStorage.getItem('forum_posts')) || [];

    // 初始化示例帖子
    if (posts.length === 0) {
        posts = [
            { id: 1, author: "李四", content: "第一位认证用户报到！大家好啊！", image: null, time: new Date(2026, 4, 20, 8, 56, 54).toLocaleString(), likes: 10, likedBy: ["张三", "李四"], comments: [] },
            { id: 2, author: "张三", content: "契弟广场终于开了，开心！", image: null, time: new Date(2026, 4, 21, 6, 56, 54).toLocaleString(), likes: 3, likedBy: ["李四"], comments: [] }
        ];
        savePosts();
    }

    function savePosts() {
        localStorage.setItem('forum_posts', JSON.stringify(posts));
    }

    // ========== 词条系统（自动从帖子内容提取）==========
    function extractWords(content) {
        const words = content.match(/[\u4e00-\u9fa5]{2,6}/g) || [];
        return [...new Set(words)];
    }

    function getHotWords() {
        const wordStats = new Map();
        posts.forEach(post => {
            const words = extractWords(post.content);
            words.forEach(word => {
                if (!wordStats.has(word)) {
                    wordStats.set(word, { count: 0, likes: 0, comments: 0 });
                }
                const stat = wordStats.get(word);
                stat.count += 1;
                stat.likes += post.likes || 0;
                stat.comments += (post.comments?.length || 0);
            });
        });
        const list = Array.from(wordStats.entries()).map(([word, stat]) => ({
            word,
            heat: stat.count + stat.likes + stat.comments
        }));
        list.sort((a, b) => b.heat - a.heat);
        const manual = MANUAL_TOP_WORDS.filter(w => list.some(item => item.word === w));
        const auto = list.filter(item => !MANUAL_TOP_WORDS.includes(item.word));
        const topList = [...manual.map(w => ({ word: w, heat: list.find(i => i.word === w)?.heat || 0 })), ...auto];
        return topList.slice(0, HOT_POST_COUNT);
    }

    // ========== 渲染烧榜 ==========
    function renderHotWords() {
        const hotWords = getHotWords();
        if (hotWords.length === 0) return '<div class="hot-item">暂无热门词条</div>';
        return hotWords.map(h => `
            <div class="hot-item" data-word="${h.word}">
                <div class="hot-name">${escapeHtml(h.word)}</div>
                <div class="hot-count">🔥 热度 ${h.heat}</div>
            </div>
        `).join('');
    }

    // ========== 渲染帖子列表 ==========
    function renderPostsList() {
        if (posts.length === 0) return '<div style="text-align:center;padding:40px;">暂无帖子，来发第一条吧～</div>';
        return posts.map(post => {
            const user = JSON.parse(localStorage.getItem('users'))?.find(u => u.username === post.author) || {};
            const showVerified = user.role === 'trainee' && user.isVerified === true;
            return `
                <div class="post-card" data-post-id="${post.id}">
                    <div class="post-header">
                        <img class="post-avatar" src="${user.avatar || 'images/people.jpg'}" alt="头像" onclick="viewProfile('${post.author}')">
                        <div class="post-author">
                            <span class="author-name" onclick="viewProfile('${post.author}')">${escapeHtml(post.author)}</span>
                            ${showVerified ? `<span class="verified-badge">${VERIFIED_BADGE_TEXT}</span>` : ''}
                            <div class="post-time">${post.time}</div>
                        </div>
                    </div>
                    <div class="post-content">${escapeHtml(post.content)}</div>
                    ${post.image ? `<img src="${post.image}" class="post-image" alt="post image">` : ''}
                    <div class="post-stats">
                        <button class="stat-btn like-btn" data-id="${post.id}">❤️ <span class="stat-num like-num" data-id="${post.id}" data-type="likes">${post.likes || 0}</span></button>
                        <button class="stat-btn comment-btn" data-id="${post.id}">💬 <span class="stat-num comment-num" data-id="${post.id}" data-type="comments">${post.comments?.length || 0}</span></button>
                    </div>
                </div>
            `;
        }).join('');
    }

    // ========== 弹窗（点赞/评论列表）==========
    function showModal(title, list) {
        const modalHtml = `
            <div class="slide-modal" id="dynamicModal">
                <div class="modal-content">
                    <div class="modal-header">
                        <span>${title}</span>
                        <button class="close-modal" id="closeModalBtn">✕</button>
                    </div>
                    <div class="modal-list">
                        ${list.map(item => `
                            <div class="modal-user-item" onclick="viewProfile('${item.username}')">
                                <img class="modal-avatar" src="${item.avatar || 'images/people.jpg'}" alt="">
                                <div>
                                    <div class="modal-username">${escapeHtml(item.username)}</div>
                                    ${item.comment ? `<div class="modal-comment-text">${escapeHtml(item.comment)}</div>` : ''}
                                </div>
                            </div>
                        `).join('')}
                        ${list.length === 0 ? '<div>暂无数据</div>' : ''}
                    </div>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        const modal = document.getElementById('dynamicModal');
        setTimeout(() => modal.classList.add('show'), 10);
        document.getElementById('closeModalBtn').addEventListener('click', () => {
            modal.classList.remove('show');
            setTimeout(() => modal.remove(), 300);
        });
    }

    function showLikesModal(postId) {
        const post = posts.find(p => p.id === postId);
        if (!post) return;
        const users = JSON.parse(localStorage.getItem('users')) || [];
        const likedUsers = (post.likedBy || []).map(username => {
            const u = users.find(u => u.username === username);
            return { username, avatar: u?.avatar || 'images/people.jpg' };
        });
        showModal(`❤️ 点赞列表 (${likedUsers.length})`, likedUsers);
    }

    function showCommentsModal(postId) {
        const post = posts.find(p => p.id === postId);
        if (!post) return;
        const comments = post.comments || [];
        const users = JSON.parse(localStorage.getItem('users')) || [];
        const commentList = comments.map(c => {
            const u = users.find(u => u.username === c.username);
            return { username: c.username, avatar: u?.avatar || 'images/people.jpg', comment: c.text };
        });
        showModal(`💬 评论列表 (${commentList.length})`, commentList);
    }

    // ========== 发帖动画 + 发帖页 ==========
    function showPostEditor() {
        const overlay = document.createElement('div');
        overlay.className = 'fullscreen-overlay';
        overlay.innerHTML = `
            <div class="post-editor">
                <div class="editor-header">
                    <button class="editor-close" id="editorCloseBtn">✕</button>
                    <button class="editor-submit" id="editorSubmitBtn">发送</button>
                </div>
                <textarea class="editor-textarea" id="postContentInput" placeholder="写点什么..." rows="6"></textarea>
                <div class="image-picker" id="imagePicker">
                    <div class="plus-icon" id="plusIcon">+</div>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
        setTimeout(() => overlay.classList.add('open'), 10);

        let selectedImage = null;
        const picker = document.getElementById('imagePicker');
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'image/*';
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    selectedImage = ev.target.result;
                    picker.style.backgroundImage = `url(${selectedImage})`;
                    picker.style.backgroundSize = 'cover';
                    picker.innerHTML = '';
                };
                reader.readAsDataURL(file);
            }
        };
        picker.addEventListener('click', () => fileInput.click());

        document.getElementById('editorCloseBtn').addEventListener('click', () => {
            overlay.classList.remove('open');
            setTimeout(() => overlay.remove(), 300);
        });

        document.getElementById('editorSubmitBtn').addEventListener('click', () => {
            const content = document.getElementById('postContentInput').value.trim();
            if (!content) {
                alert('写点内容再发吧');
                return;
            }
            const newPost = {
                id: Date.now(),
                author: currentUser.username,
                content,
                image: selectedImage || null,
                time: new Date().toLocaleString(),
                likes: 0,
                likedBy: [],
                comments: []
            };
            posts.unshift(newPost);
            savePosts();
            overlay.classList.remove('open');
            setTimeout(() => {
                overlay.remove();
                renderForum();
            }, 300);
        });
    }

    // ========== 全局渲染 ==========
    function renderForum() {
        const container = document.getElementById('forumApp');
        container.innerHTML = `
            <div class="hot-section">
                ${isTrainee ? '<div class="plus-btn" id="plusBtn">+</div>' : ''}
                <div class="hot-title">🔥 烧榜</div>
                <div class="hot-list" id="hotList">${renderHotWords()}</div>
            </div>
            <div class="posts-list" id="postsList">${renderPostsList()}</div>
        `;

        // 绑定烧榜点击事件（跳转到词条聚合页）
        document.querySelectorAll('.hot-item').forEach(el => {
            el.addEventListener('click', () => {
                const word = el.dataset.word;
                alert(`跳转到词条「${word}」的聚合页（预留）`);
            });
        });

        // 绑定点赞/评论按钮事件
        document.querySelectorAll('.like-num').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const postId = parseInt(el.dataset.id);
                showLikesModal(postId);
            });
        });
        document.querySelectorAll('.comment-num').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const postId = parseInt(el.dataset.id);
                showCommentsModal(postId);
            });
        });

        if (isTrainee) {
            document.getElementById('plusBtn')?.addEventListener('click', showPostEditor);
        }
    }

    // ========== 工具函数 ==========
    window.viewProfile = (username) => {
        alert(`跳转到 ${username} 的个人主页（预留）`);
        // window.location.href = `profile.html?user=${username}`;
    };

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, (m) => {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ========== 初始化 ==========
    renderForum();

    // 导航栏滚动隐藏
    let lastScrollTop = 0;
    const header = document.querySelector('header');
    window.addEventListener('scroll', function() {
        let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        if (scrollTop > lastScrollTop && scrollTop > 50) {
            header.classList.add('hide');
        } else {
            header.classList.remove('hide');
        }
        lastScrollTop = scrollTop;
    });
</script>
</body>
</html>
