<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
<div class="header-container">
    <a href="about.html">
    <img src="images/logo.png" alt="公司Logo" class="logo">
</a>
    <nav>
        <a href="index.html">Home</a>
        <a href="news.html" class="current">大事件</a>
        <a href="forum.html">铁汁窝</a>
    </nav>
    <!-- 新增：个人中心图标 -->
    <div class="user-area">
        <a href="profile.html" class="user-icon">
            <img src="images/people.jpg" alt="个人中心" class="user-avatar">
        </a>
    </div>
</div>
</header>

<section id="news">
    <div class="news-card">
        <a href="news-detail1.html" style="text-decoration:none; display:block;">
            <p>iX*OnE二专《iX'World》上线</p>
            <small>2024年</small>
        </a>
    </div>
    <div class="news-card">
        <a href="news-detail2.html" style="text-decoration:none; display:block;">
            <p>时代骏风一周年纪念</p>
            <small>2025年</small>
        </a>
    </div>
</section>

<footer>
    <p>© 2026 时代骏风</p>
</footer>

<script>
let lastScrollTop = 0;
const header = document.querySelector('header');
window.addEventListener('scroll', function() {
    let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    if (scrollTop > lastScrollTop && scrollTop > 50) {
        header.classList.add('hide');
    } else {
        header.classList.remove('hide');
    }
    lastScrollTop = scrollTop;
});
</script>

</body>
</html>
