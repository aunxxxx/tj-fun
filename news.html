<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>News</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
<div class="header-container">
    <img src="images/logo.png" alt="公司Logo" class="logo">
    <nav>
        <a href="index.html">Home</a>
       <a href="news.html" class="current">News</a>
        <a href="about.html">About TJ</a>
    </nav>
</div>
</header>

<section id="news">
    <h2>News</h2>
    
    <!-- 新闻卡片1 -->
    <a href="news1.html" class="news-card">
        <p>🎵 iX*OnE二专《iX'World》已在网易云音乐上线</p>
        <small style="color:#888;">2024年发布</small>
    </a>
    
</section>

<footer>
    <p>© 2026 时代骏风</p>
</footer>

<script>
    let lastScrollTop = 0;
    const header = document.querySelector('header');

    window.addEventListener('scroll', function() {
        let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        
        if (scrollTop > lastScrollTop && scrollTop > 50) {
            header.classList.add('hide');
        } else {
            header.classList.remove('hide');
        }
        lastScrollTop = scrollTop;
    });
</script>
</body>
</html>
