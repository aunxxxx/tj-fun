<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Comment Test</title>
  <style>
    .comment {
      padding: 6px;
      margin-left: 20px;
      border-left: 1px solid #ddd;
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="module">
  import { commentState, updateCommentState } from "./comment.js";

  // ===== 假数据 =====
  const mockComments = [
    { id: "1", parentId: null, content: "第一条评论", user: { name: "Alice" } },
    { id: "2", parentId: "1", content: "回复第一条", user: { name: "Bob" } },
    { id: "3", parentId: "2", content: "继续回复", user: { name: "Charlie" } }
  ];

  // 初始化数据
  updateCommentState(commentState, mockComments);

  console.log(commentState.commentTree);

  // ===== 渲染函数（直接写在这里，先别拆文件）=====
  function render(list, container, level = 0) {
    list.forEach(item => {
      const div = document.createElement("div");
      div.className = "comment";
      div.style.marginLeft = level * 20 + "px";

      div.innerHTML = `
        <b>${item.user.name}</b>: ${item.content}
      `;

      container.appendChild(div);

      if (item.children && item.children.length > 0) {
        render(item.children, container, level + 1);
      }
    });
  }

  const root = document.getElementById("root");
  render(commentState.commentTree, root);
</script>

</body>
</html>
