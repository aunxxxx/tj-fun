<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登顶计划 - 时代骏风</title>
<style>
    /* ========== 自定义变量（方便你调透明度和后续改背景）========== */
    :root {
        --card-opacity: 0.92;      /* 👈 成员卡片背景透明度（0~1），后续改这里 */
        --top-card-opacity: 0.95;
        --bg-gradient-end: rgba(217, 244, 255, 1);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        min-height: 100%;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: 
            linear-gradient(to bottom, transparent 60%, var(--bg-gradient-end) 100%),
            url('images/b.jpg') top center no-repeat;
        background-size: 100% auto;
    }

    /* 固定导航栏 */
    .vote-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: rgba(255,255,255,0.96);
        backdrop-filter: blur(8px);
        box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        z-index: 1000;
        transition: transform 0.3s ease;
    }

    .vote-header.hide {
        transform: translateY(-100%);
    }

    .nav-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 1200px;
        margin: 0 auto;
        padding: 12px 24px;
    }

    .back-btn {
        background: none;
        border: none;
        font-size: 18px;
        font-weight: 500;
        cursor: pointer;
        padding: 6px 14px;
        border-radius: 30px;
    }

    .nav-tabs {
        display: flex;
        gap: 12px;
        background: #f0f2f8;
        padding: 4px;
        border-radius: 40px;
    }

    .tab-btn {
        font-size: 18px;
        font-weight: 600;
        padding: 6px 24px;
        border-radius: 32px;
        border: none;
        background: transparent;
        cursor: pointer;
    }

    .tab-btn.active {
        background: white;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        color: #ff6b4a;
    }

    .user-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
        cursor: pointer;
    }

    /* 主内容区 */
    .vote-container {
        max-width: 700px;
        margin: 0 auto;
        padding: 100px 20px 60px;
    }

    /* ========== 标题区域（已去掉文字，但保留高度 ========== */
    /* 👇 后续你想加回标题，直接在这里加 h1 或 div 内容即可 */
    .title-placeholder {
        height: 70px;    /* 👈 预留空间，后续你可改成实际标题 */
        margin-bottom: 16px;
    }

    /* 第一名卡片 */
    .top-card {
        background: rgba(255, 248, 235, var(--top-card-opacity));
        border-radius: 48px;
        padding: 24px 20px;
        text-align: center;
        margin-bottom: 32px;
        border: 1px solid #ffe0b0;
        position: relative;
    }

    .crown {
        font-size: 34px;
        position: absolute;
        top: -18px;
        left: 50%;
        transform: translateX(-50%);
    }

    .avatar {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        object-fit: cover;
        margin: 0 auto 12px;
        border: 3px solid #ffc285;
        cursor: pointer;
    }

    .member-name {
        font-size: 22px;
        font-weight: 700;
        margin: 8px 0 4px;
    }

    .member-votes {
        font-size: 18px;
        color: #6c757d;
        margin-bottom: 14px;
    }

    .vote-button {
        background: #ff7b5c;
        border: none;
        padding: 8px 28px;
        border-radius: 40px;
        font-size: 18px;
        font-weight: bold;
        color: white;
        cursor: pointer;
    }

    /* 网格 — 3列 */
    .candidates-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px 14px;
    }

    /* 👇 成员卡片透明度：直接改 --card-opacity */
    .candidate-card {
        background: rgba(255, 255, 255, var(--card-opacity));
        backdrop-filter: blur(2px);
        border-radius: 32px;
        padding: 16px 8px 14px;
        text-align: center;
        position: relative;
        transition: 0.2s;
        border: 1px solid rgba(255,255,240,0.6);
    }

    /* 排名角标 (#2, #3, #4...) */
    .rank-badge {
        position: absolute;
        top: 10px;
        left: 12px;
        background: #ff9f4a;
        color: white;
        font-weight: bold;
        font-size: 13px;
        padding: 2px 8px;
        border-radius: 40px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .candidate-card .avatar {
        width: 90px;
        height: 90px;
        border: 2px solid #ffcd94;
    }

    .no-first-tip {
        background: rgba(255,240,210,0.7);
        border-radius: 48px;
        padding: 30px 20px;
        text-align: center;
        margin-bottom: 32px;
        font-weight: 500;
        color: #aa7a4a;
    }

    .disabled-btn {
        background: #bbb;
        cursor: not-allowed;
        opacity: 0.6;
    }
</style>
</head>
<body>

<div class="vote-header" id="voteHeader">
    <div class="nav-container">
        <button class="back-btn" id="backBtn">← 返回</button>
        <div class="nav-tabs">
            <button class="tab-btn active" data-gender="boys">Boys</button>
            <button class="tab-btn" data-gender="girls">Girls</button>
        </div>
        <img src="images/people.jpg" alt="个人中心" class="user-avatar" id="userAvatar">
    </div>
</div>

<div class="vote-container" id="voteContainer"></div>

<script>
    // ========== 数据 ==========
    // 👇 这是「上周最终票数」（管理员结算后修改）
    let boysData = [
        { id: 1, name: "陈朗", totalVotes: 0, avatar: "images/陈朗.jpg" },
        { id: 2, name: "冯浩轩", totalVotes: 0, avatar: "images/冯浩轩.jpg" },
        { id: 3, name: "谭思盈", totalVotes: 0, avatar: "images/谭思盈.png" }
    ];
    let girlsData = [
        { id: 4, name: "马睿婕", totalVotes: 0, avatar: "images/马睿婕.jpg" },
        { id: 5, name: "徐楚茹", totalVotes: 0, avatar: "images/徐楚茹.jpg" }
    ];

    let currentGender = "boys";
    let voteEnabled = false;

    // 检查投票开放时间（6月1日）
    function checkVoteAvailability() {
        const now = new Date();
        const openDate = new Date(2026, 5, 1); // 2026年6月1日
        voteEnabled = now >= openDate;
        return voteEnabled;
    }

    // 按总票数排序
    function sortByVotes(list) {
        return [...list].sort((a,b) => b.totalVotes - a.totalVotes);
    }

    // 渲染页面（只看上周票数）
    function render() {
        const container = document.getElementById("voteContainer");
        const rawList = currentGender === "boys" ? boysData : girlsData;
        const sorted = sortByVotes(rawList);
        const hasFirst = sorted.length > 0 && sorted[0].totalVotes > 0;

        let html = `<div class="title-placeholder"></div>`; // 👈 预留标题位置

        // 第一名区域
        if (hasFirst) {
            const first = sorted[0];
            html += `
                <div class="top-card">
                    <div class="crown">👑</div>
                    <img class="avatar" src="${first.avatar}" alt="${first.name}" onclick="viewProfile(${first.id})">
                    <div class="member-name">${first.name}</div>
                    <div class="member-votes">🎫 ${first.totalVotes} 登顶票</div>
                    <button class="vote-button" data-id="${first.id}" data-name="${first.name}">🚩 助登</button>
                </div>
            `;
        } else {
            html += `<div class="no-first-tip">✨ 暂无登顶选手 ✨</div>`;
        }

        // 其他选手（第二名开始）
        const others = sorted.slice(1);
        if (others.length) {
            html += `<div class="candidates-grid">`;
            others.forEach((m, idx) => {
                const rank = idx + 2; // 第二名 = #2
                html += `
                    <div class="candidate-card">
                        <div class="rank-badge">#${rank}</div>
                        <img class="avatar" src="${m.avatar}" alt="${m.name}" onclick="viewProfile(${m.id})">
                        <div class="member-name">${m.name}</div>
                        <div class="member-votes">🎫 ${m.totalVotes} 登顶票</div>
                        <button class="vote-button" data-id="${m.id}" data-name="${m.name}">助登</button>
                    </div>
                `;
            });
            html += `</div>`;
        }

        container.innerHTML = html;

        // 绑定投票事件（仅记录意愿，不刷新票数）
        document.querySelectorAll(".vote-button").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                if (!checkVoteAvailability()) {
                    alert("⏰ 登顶计划将于6月1日开启，敬请期待！");
                    return;
                }
                const id = btn.getAttribute("data-id");
                const name = btn.getAttribute("data-name");
                // 仅演示：提示“已记录助登意愿”（未来管理员后台可看）
                alert(`✅ 已记录你对「${name}」的助登意愿。`);
                // TODO: 后续发送到后台记录（本周新增 +1）
            });
        });
    }

    // 预留个人主页跳转（暂不跳）
    window.viewProfile = function(id) {
        // 未来改成 window.location.href = `profile.html?id=${id}`;
        alert("🔗 个人主页预留，暂不跳转");
    };

    // 切换性别
    function switchGender(gender) {
        currentGender = gender;
        render();
        document.querySelectorAll(".tab-btn").forEach(btn => {
            if (btn.getAttribute("data-gender") === gender) {
                btn.classList.add("active");
            } else {
                btn.classList.remove("active");
            }
        });
    }

    // 导航栏交互 + 返回首页 + 头像预留
    function bindUI() {
        document.getElementById("backBtn").addEventListener("click", () => {
            window.location.href = "index.html";
        });
        document.getElementById("userAvatar").addEventListener("click", () => {
            alert("个人中心预留");
        });
        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const gender = btn.getAttribute("data-gender");
                if (gender === currentGender) return;
                switchGender(gender);
            });
        });
    }

    // 滚动隐藏
    let lastScroll = 0;
    function setupScrollHide() {
        const header = document.getElementById("voteHeader");
        window.addEventListener("scroll", () => {
            const top = window.scrollY;
            if (top > lastScroll && top > 60) {
                header.classList.add("hide");
            } else {
                header.classList.remove("hide");
            }
            lastScroll = top;
        });
    }

    // 初始化
    function init() {
        checkVoteAvailability();
        bindUI();
        setupScrollHide();
        render();
    }

    init();
</script>
</body>
</html>
