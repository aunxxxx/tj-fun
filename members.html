<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Members</title>
<link rel="stylesheet" href="css/style.css">
<style>
    @media (max-width: 768px) {
        .header-container {
            padding: 10px 15px;
            justify-content: center;
        }
        .logo {
            height: 35px;
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
        }
        nav {
            position: static;
            transform: none;
            margin: 0 auto;
        }
        nav a {
            font-size: 26px !important;
            margin: 0 15px !important;
            padding: 8px 12px !important;
        }
        .header-container::after {
            display: none;
        }
    }
    @media (max-width: 480px) {
        .logo {
            height: 30px;
        }
        nav a {
            font-size: 22px !important;
            margin: 0 10px !important;
            padding: 6px 10px !important;
        }
    }
</style>
</head>
<body>

<header>
<div class="header-container">
    <img src="images/logo.png" alt="公司Logo" class="logo">
    <nav>
        <a href="index.html">Home</a>
        <a href="news.html">News</a>

    </nav>
</div>
</header>

        </div>
        <div class="member-card">
            <img src="images/陈朗.jpg" alt="陈朗">
            <h3>陈朗</h3>
            <p>2005 / 08 / 26</p>
        </div>
        <div class="member-card">
            <img src="images/冯浩轩.jpg" alt="冯浩轩">

        <div class="member-card">

            <p>2005 / 04 / 06</p>
        </div>
        <div class="member-card">
            <img src="images/谭思盈.png" alt="谭思盈">
            <h3>谭思盈</h3>
            <p>2004 / 10 / 27</p>
        </div>
        <div class="member-card">
            <img src="images/陈安愉.png" alt="陈安愉">

        </div>
        <div class="member-card">
            <img src="images/陈珊珊.png" alt="陈珊珊">

        </div>
        <div class="member-card">
            <img src="images/陈琪琪.png" alt="陈琪琪">
            <h3>陈琪琪</h3>
            <p>2005 / 08 / 10</p>

    </div>
</section>

<footer>
    <p>© 2026 时代骏风</p>
</footer>

<script>
let lastScrollTop = 0;
const header = document.querySelector('header');
window.addEventListener('scroll', function() {
    let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    if (scrollTop > lastScrollTop && scrollTop > 50) {
        header.classList.add('hide');
    } else {
        header.classList.remove('hide');
    }
    lastScrollTop = scrollTop;
});
</script>

</body>
</html>
