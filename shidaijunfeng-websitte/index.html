<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>时代骏风</title>
<style>
body { margin:0; font-family: Arial, sans-serif; background:#111; color:#fff;}

/* 固定头部 */
header {
    position: fixed;
    top:0;
    left:0;
    width:100%;
    background:#222;
    z-index:1000;
    transition: transform 0.3s ease;
}

header.hide {
    transform: translateY(-100%);
}

.header-container {
    display:flex;
    align-items:center;
    padding:10px 20px;
}

.logo {
    height:50px;
    margin-right:20px;
}

nav a {
    color:#fff;
    margin:0 15px;
    text-decoration:none;
    font-weight:bold;
}

/* 主页、新闻、成员部分 */
section {
    padding:100px 20px 40px 20px;
}

.department-card, .news-card { 
    display:inline-block; 
    width:200px; 
    margin:10px; 
    cursor:pointer; 
    text-align:center;
    text-decoration: none;
}
.department-card img, .news-card img { 
    width:100%; 
    border-radius:8px; 
    transition: transform 0.3s;
}
.department-card:hover img, .news-card:hover img { 
    transform: scale(1.05); 
}
.department-card p, .news-card p { 
    margin-top:5px; 
    color:#fff; 
}

/* 成员卡片 */
.member-card { 
    display:inline-block; 
    width:200px; 
    margin:10px; 
    background:#222; 
    padding:10px; 
    border-radius:8px; 
    text-align:center;
}
.member-card img { width:100%; border-radius:50%; }

footer { 
    background:#222; 
    padding:20px; 
    text-align:center; 
    color:#888; 
}
</style>
</head>
<body>

<header>
<div class="header-container">
    <img src="https://via.placeholder.com/150x50?text=TJ" alt="Logo" class="logo">
    <nav>
        <a href="#home">Home</a>
        <a href="#news">News</a>
        <a href="#about">About TJ</a>
    </nav>
</div>
</header>

<section id="home">
    <h2>欢迎来到时代骏风</h2>
    <div class="department-card">
        <img src="https://via.placeholder.com/200x200?text=iX*OnE" alt="iX*OnE">
        <p>iX*OnE</p>
    </div>
</section>

<section id="news">
    <h2>新闻</h2>
    <div class="news-card">
        <p>iX*OnE二专《iX'World》已在网易云音乐上线</p>
    </div>
</section>

<section id="about">
    <h2>关于时代骏风</h2>
    <p>时代骏风（TJ Entertainment）成立于2024年，是一家集组织大型文艺演出、艺人培训、艺人经纪为一体的专业文化娱乐传播机构，也是率先采用练习生养成模式进行明星培养的国内经纪娱乐公司。</p>
</section>

<section id="members">
    <h2>Members</h2>
    <div class="member-card">
        <img src="https://via.placeholder.com/150x150?text=Member" alt="成员">
        <h3>马睿婕</h3>
        <p>2004/09/02</p>
    </div>
    <div class="member-card">
        <img src="https://via.placeholder.com/150x150?text=Member" alt="成员">
        <h3>陈朗</h3>
        <p>2005/08/26</p>
    </div>
</section>

<footer>
    <p>© 2026 时代骏风</p>
</footer>

<script>
    let lastScrollTop = 0;
    const header = document.querySelector('header');

    window.addEventListener('scroll', function() {
        let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        
        if (scrollTop > lastScrollTop && scrollTop > 50) {
            header.classList.add('hide');
        } else {
            header.classList.remove('hide');
        }
        lastScrollTop = scrollTop;
    });
</script>
</body>
</html>
